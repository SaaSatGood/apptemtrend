name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
      - name: Install workspace
        run: npm ci
      - name: Backend tests and build
        run: npm test && npm run typecheck && npm run build && npm audit --omit=dev
        working-directory: backend
      - name: Frontend lint, build and production audit
        run: npm run lint && npm run build && npm audit --omit=dev
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser smoke tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
